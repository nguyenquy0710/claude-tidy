name: Build

# claude-tidy is a Windows-only desktop app (pywebview + WebView2) — see
# CLAUDE.md "Out of scope: macOS/Linux builds" — so every job here runs on
# windows-latest to match the environment claude-tidy.spec actually targets.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # pull_request:
  #   branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install claude-tidy + dev extras
        run: python -m pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest

  build:
    needs: test
    runs-on: windows-latest
    # Only package a .exe for a version tag or a manual run — plain
    # branch/PR pushes only need the test job above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install claude-tidy + dev extras
        run: python -m pip install -e .[dev]

      - name: Read version from pyproject.toml
        id: version
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $pyVersion = "${{ steps.version.outputs.version }}"
          if ($tagVersion -ne $pyVersion) {
            Write-Error "Tag v$tagVersion does not match pyproject.toml version $pyVersion"
            exit 1
          }

      # --onedir per claude-tidy.spec (see its own header comment for why,
      # and the T33/ttkbootstrap-migration plans it cites) — cold-start
      # measurements ruled out --onefile.
      - name: Build with PyInstaller
        run: pyinstaller claude-tidy.spec

      - name: Zip dist/claude-tidy
        id: zip
        run: |
          $zipName = "claude-tidy-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path "dist\claude-tidy\*" -DestinationPath $zipName
          echo "name=$zipName" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: claude-tidy-${{ steps.version.outputs.version }}-win64
          path: ${{ steps.zip.outputs.name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
