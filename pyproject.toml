[project]
name = "claude-tidy"
version = "0.1.0"
description = "Safely clean up Claude Code session data and Claude Desktop cache on Windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=6.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[project.scripts]
claude-tidy = "claude_tidy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_tidy*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
